spring.application.name=home-helper
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.sql.init.mode=embedded
app.runner.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
email.verification.deletionTime=600
email.resetPassword.deletionTime=600
email.resetPassword.baseUrl=http://localhost:8080
spring.config.import=optional:file:env.properties
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.devtools.livereload.enabled=true
app.perspective.api.key=${PERSPECTIVE_API_KEY}
mapbox.api.key=${MAPBOX_KEY:default}
ipapi.api.key=${IPAPI_KEY:default}
static.resource.folder=uploads
# Change this to test that a competition is generated at a specific time
# Format is <Seconds> <Minutes> <Hours> <Day of Month> <Month> <Day of Week>  - * means every
scheduler.cron=0 59 23 * * SUN
# uncomment this to show spring security debug logs
#logging.level.org.springframework.security=DEBUG
prod.generate=false
spring.jpa.show-sql=true
