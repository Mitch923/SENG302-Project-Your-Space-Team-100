<div class="h-100"
     th:fragment="modelCard(name, id, imagePath, filePath, type, modifiable, emissive, parallelTexturePath)">
  <a class="add-model-btn d-block h-100 text-decoration-none"
     role="button"
     tabindex="0"
     th:attr="data-filepath=${filePath},
              data-type=${type},
              data-model-name=${name},
              data-id=${id},
              data-parallel-texture-path=${parallelTexturePath}">
    <div class="card w-100 h-100 border-0 shadow-sm rounded-3 overflow-hidden hover-animate-model"
         style="cursor: pointer;">
      <div class="position-relative">
        <div class="position-absolute top-0 start-0 mx-1 mt-1" style="z-index: 10;"
             th:if="${emissive}">
          <svg class="bi bi-brightness-high-fill position-absolute top-0 start-0"
               fill="currentColor" height="20"
               viewBox="0 0 16 16"
               width="20" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M12 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
          </svg>
        </div>
        <button
            class="btn btn-sm btn-danger delete-model-button position-absolute top-0 end-0 m-2"
            data-bs-target="#deleteModelModal"
            data-bs-toggle="modal"
            onclick="event.stopPropagation()"
            th:data-bs-id="${id}"
            th:data-bs-type="${type}"
            th:if="${modifiable}"
        >
          <i class="bi">
            <svg class="bi bi-trash" fill="currentColor" height="16" viewBox="0 0 16 16"
                 width="16" xmlns="http://www.w3.org/2000/svg">
              <path
                  d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
              <path
                  d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
            </svg>
          </i>
        </button>

        <!-- Image -->
        <div class="ratio ratio-1x1" id="image-container">
          <img alt="Preview of [[${name}]]"
               class="card-img-top object-fit-cover"
               th:src="@{${imagePath}}">
        </div>
      </div>

      <!-- Body -->
      <div class="card-body p-2 text-center bg-light">
        <p class="card-text text-truncate mb-0"
           style="font-size: 0.8rem;"
           th:text="${name}">
          Model Name
        </p>
      </div>
    </div>
  </a>
</div>
