<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:insert="~{fragments/head :: head(
      'Create Renovation | Your Space',
      'Create Renovation',
      'profile')}"></th:block>
  <meta context="text/html; charset=UTF-8" http-equiv="Content-Type">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>Create New Renovation Record</title>
  <link rel="stylesheet" th:href="@{/css/renovationForm.css}"/>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<div th:replace="~{fragments/internal_header:: internalHeader}"></div>
<div class="container mt-4">
  <form id="renovationForm" method="post" th:action="@{createRenovationForm}">
    <div class="card p-4 shadow-sm">
      <h3 class="card-title mb-4">Create New Renovation Record</h3>
      <div class="row">
        <div class="col-lg-6 pe-lg-4 border-end">
          <div class="mb-3">
            <label class="form-label" for="name">Name:</label>
            <input autofocus class="form-control" data-cy="name" id="name"
                   placeholder="Name"
                   th:classappend="${errors != null and (errors.containsKey('name') or errors.containsKey('duplicate'))} ? 'is-invalid'"
                   th:name="name" th:value="*{name}"
                   type="text">
            <p class="text-danger"
               th:if="${errors != null && errors.containsKey('name')}"
               th:text="${errors.get('name')}"></p>
            <p class="text-danger"
               th:if="${errors != null && errors.containsKey('duplicate')}"
               th:text="${errors.get('duplicate')}"></p>
          </div>
          <div class="mb-3">
            <label class="form-label" for="description">Description:</label>
            <textarea class="form-control" data-cy="description" id="description"
                      placeholder="Description"
                      rows="6"
                      th:classappend="${errors != null and errors.containsKey('description')} ? 'is-invalid'"
                      th:name="description" th:text="*{description}"
                      type="text">
            </textarea>
            <p><span id="charCount"
                     th:text="${descriptionLength == null ? 0 : descriptionLength} + '/512'">0/512</span>
            </p>
            <p class="text-danger"
               th:if="${errors != null && errors.containsKey('description')}"
               th:text="${errors.get('description')}"></p>
          </div>
          <div class="mb-3">
            <div th:replace="~{fragments/locationFragment :: locationFragment(${false})}"></div>
          </div>
        </div>

        <div class="col-lg-6 ps-lg-4">
          <h5>Add Rooms</h5>
          <div class="row">
            <div class="col-lg-9">
              <label class="form-label" for="roomName">Room Name:</label>
              <input class="form-control" id="roomName" placeholder="Enter Room Name"
                     th:classappend="${errors != null and errors.containsKey('rooms')} ? 'is-invalid'"
                     th:name="roomName" th:value="${roomName == null ? '' : roomName}"
                     type="text">
            </div>
            <div class="col-lg-3 d-flex align-items-end">
              <button class="btn btn-primary w-90" id="addRoomButton" type="button">Add Room
              </button>
            </div>
          </div>
          <p class="text-danger"
             th:if="${errors != null && errors.containsKey('rooms')}"
             th:text="${errors.get('rooms')}"></p>
          <p class="text-danger mt-1" hidden id="roomError"></p>

          <div class="room-container mt-3" id="roomList">
            <!-- Room list items here -->
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <a class="btn btn-secondary" id="cancelButton" th:href="@{myRenovations}">Cancel</a>
        <button class="btn btn-primary" id="submitButton" type="submit">Create</button>
      </div>
    </div>
  </form>
</div>
<script defer th:src="@{/js/createRenovation.js}" th:type="module"></script>
<script th:inline="javascript" th:type="module">
    // Extract the roomNames list from Thymeleaf generated by ChatGPT
    let roomNames = /*[[${roomNames}]]*/ [];
    console.log("roomNames: " + roomNames);

    document.addEventListener('DOMContentLoaded', function () {
        const roomList = document.getElementById('roomList');

        if (Array.isArray(roomNames) && roomNames.length > 0) {
            roomNames.forEach(roomName => {
                const roomElement = createRoomElement(roomName, onRoomDelete);
                roomList.appendChild(roomElement);

                const hiddenInput = createHiddenElement(roomName);
                roomList.appendChild(hiddenInput);
            });
        }
    });
</script>
</body>
</html>
