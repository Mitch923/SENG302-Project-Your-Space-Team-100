<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta context="text/html; charset=UTF-8" http-equiv="Content-Type">
  <meta content="width=device-width, initial-scale=1" name="viewport">

  <th:block th:insert="~{fragments/head :: head(
      'My Renovations | Your Space',
      'My Renovations',
      'renovation, contracter, construction')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/myRenovationsTemplate.css}"/>
</head>
<body>
<header th:replace="~{fragments/internal_header:: internalHeader}"></header>
<!--script purposely not deferred so that event listener works - see script -->
<script th:src="@{/js/myRenovations.js}"></script>

<!--Modal Structure taken from bootstrap documentation example-->
<div class="modal" id="confirmDeleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm</h5>
        <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this renovation record?</p>
      </div>
      <div class="modal-footer">
        <form method="post" th:action="@{/deleteRenovation}">
          <input id="renovationId" name="renovationId" type="hidden">
          <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-danger" data-bs-dismiss="modal" type="submit">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="container my-4 d-flex flex-column">
  <div class="mb-3 shadow-sm rounded-2 flex-grow-1 p-3 bg-white">
    <h2 class="text-bold text-dark mb-3">My Renovations: </h2>
    <div>
      <a class="btn btn-primary" th:href="@{createRenovationForm}">Create new
        renovation record +</a>
    </div>
  </div>

  <div class="mb-3 shadow-sm rounded-2 flex-grow-1 min-vh-50 p-3 bg-white">
    <!-- class has padding at the top to account for the being no top margin in the cards -->
    <h5 class="display-5 ms-3 me-3 mt-3 mb-3" th:if="${renovations.empty}">You haven't made any
      renovations yet!</h5>

    <div class="row">
      <!-- Class generated by ChatGPT, It's purpose is to make the cards go in two columns on larger screens -->
      <div class="col-12 col-md-6 mb-2" th:each="renovation : ${renovations}">
        <div class="card shadow-sm hover-animate ms-2 me-2">
          <div class="row g-0">
            <div class="col-10">
              <a class="text-decoration-none text-dark"
                 id="renovation-link" th:href="@{/viewRenovation/{id}(id=${renovation.id})}">
                <div class="card-body card-button renovation-text">
                  <!-- Header altered by ChatGPT to get both the name and number of rooms on the same line -->
                  <h5 class="card-title d-flex justify-content-between align-items-center">
                    <span class="text-truncate me-2 md-2 renovation-text mw-75"
                          style="word-break: break-all;"
                          th:text="${renovation.getName()}"></span>
                    <small class="text-muted ms-auto text-truncate renovation-text"
                           th:text="'No. Rooms: ' + ${renovation.getRooms().size()}"></small>
                  </h5>
                  <p class="card-text text-truncate renovation-text mw-100"
                     style="word-break: break-all;"
                     th:text="${renovation.getDescription()}"></p>
                </div>
              </a>
            </div>
            <button
                class="col-2 btn btn-outline-danger rounded-start-0 d-flex align-items-center justify-content-center"
                data-bs-target="#confirmDeleteModal"
                data-bs-toggle="modal"
                th:data-id="${renovation.id}" th:data-name="${renovation.name}">
              <svg class="bi bi-trash-fill" fill="currentColor" height="1rem"
                   viewBox="5.5 5.5 5 5"
                   width="1rem" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M6.146 6.146a.5.5 0 0 1 .708 0L8 7.293l1.146-1.147a.5.5 0 1 1 .708.708L8.707 8l1.147 1.146a.5.5 0 0 1-.708.708L8 8.707 6.854 9.854a.5.5 0 0 1-.708-.708L7.293 8 6.146 6.854a.5.5 0 0 1 0-.708"/>
              </svg>
            </button>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
    /*
    Generated by ChatGPT adds listener to all the delete buttons that updates the popup with the information
    of the record that was selected to be deleted.
     */
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("[data-bs-toggle='modal']").forEach(button => {
            button.addEventListener("click", function () {
                let renovationId = this.getAttribute("data-id");
                let renovationName = this.getAttribute("data-name");

                // Update the modal text
                let modalTitle = document.querySelector("#confirmDeleteModal .modal-title");
                modalTitle.textContent = `${renovationName}`;

                // Set the hidden input value to id of the record
                document.getElementById("renovationId").value = renovationId;
            });
        });
    });
</script>
</body>
</html>
