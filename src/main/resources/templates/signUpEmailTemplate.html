<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Your Space Email</title>
</head>
<!--Email template Generated by chatGPT with original team 100 content-->
<body
    style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; text-align: center;">

<table
    style="max-width: 600px; margin: auto; background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
  <tr>
    <td style="text-align: center; padding-bottom: 20px;">
      <!-- HomeHelper Logo -->
      <img alt="HomeHelper Logo" src="cid:hhLogo" style="max-width: 120px;">
    </td>
  </tr>
  <tr>
    <td>
      <h2 style="color: #333;">Hi, <span th:text="${name}"></span></h2>
      <p style="color: #555; font-size: 16px;">
        Thank you for using Your Space! We look forward to joining you on your renovation journey.
        If you didn’t register, ignore this email, and your account will be deleted in 10 minutes.
      </p>
      <p style="font-weight: bold; color: #333; font-size: 18px;">
        <span th:text="${message}"></span>
      </p>
      <p style="margin-top: 30px; font-size: 14px; color: #888;">
        Best regards,<br>
        <b>Your Space Team</b>
      </p>
    </td>
  </tr>
</table>

</body>
</html>
