<!DOCTYPE html>
<html lang="en">
<head>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <th:block th:insert="~{fragments/head :: head(
        'Your Space',
        'Learn more about how Your Space can help you renovate!',
        'about home helper')}"></th:block>
</head>
<body class="bg-dark-subtle">
<div th:replace="~{fragments/public_header:: publicHeader}"></div>
<div class="container-fluid vh-80 d-flex mt-5 justify-content-center">
  <div class="row w-100 justify-content-center">
    <div class="col-sm-10 col-md-4 col-lg-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <form id="resetPasswordForm" method="POST" th:action="@{reset}">
            <input class="d-none" id="firstname" th:value="${firstName}"/>
            <input class="d-none" id="lastname" th:value="${lastName}"/>
            <input class="d-none" id="email" th:value="${email}"/>
            <div class="d-flex justify-content-between align-items-start">
              <h1 class="card-title mr-10">Reset Password</h1>
            </div>
            <div class="form-group p-2">
              <input id="tokenInput" name="token" type="hidden" value="">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" name="password" placeholder="new password"
                     type="password">
              <p class="text-danger" id="passwordError" style="display: none;"></p>
            </div>
            <div class="form-group p-2">
              <label class="form-label" for="confirm">Confirm Password</label>
              <input class="form-control" id="confirm" name="confirm"
                     placeholder="retype password" type="password">
              <p class="text-danger" id="confirmError" style="display: none;"></p>
            </div>
            <div class="d-grid p-2">
              <button class="btn btn-primary btn-block" id="resetPasswordSubmit" type="submit">
                Submit
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/fieldValidation.js}"></script>
<script>
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Set the token input field
    document.addEventListener("DOMContentLoaded", function () {
        const token = getQueryParam("token"); // Get token from URL
        if (token) {
            document.getElementById("tokenInput").value = token; // Set hidden input value
        }
    });

    // Initialize with reset password-specific error messages
    const runPasswordValidation = setupPasswordValidation({
        invalidPassword: "Your password must be at least 8 characters long and include at least one uppercase letter, one lowercase letter, one number, and one special character",
        passwordLength: "Password must be 255 characters long or less",
        passwordsMatching: "The passwords do not match",
        containsUserDetails: "Your password cannot contain any details from your profile"
    });

    const form = document.getElementById("resetPasswordForm");

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (runPasswordValidation()) {
            this.submit();
        }
    });

</script>
</body>
</html>
