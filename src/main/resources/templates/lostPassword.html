<!DOCTYPE html>
<html lang="en">
<head>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <th:block th:insert="~{fragments/head :: head(
      'Your Space',
      'Learn more about how Your Space can help you renovate!',
      'about home helper')}"></th:block>
</head>
<body class="bg-dark-subtle">
<div th:replace="~{fragments/public_header:: publicHeader}"></div>
<div class="container-fluid vh-80 d-flex mt-5 justify-content-center">
  <div class="row w-100 justify-content-center">
    <div class="col-sm-10 col-md-4 col-lg-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <form id="lostPasswordForm" method="POST" th:action="@{reset}">
            <div class="d-flex justify-content-between align-items-start">
              <h1 class="card-title mr-10">Misplace your tools?</h1>
              <a class="btn btn-secondary p-2" th:href="@{/login}">Cancel</a>
            </div>
            <span>Enter your email below and, we'll send you a link to reset your password.</span>
            <div class="form-group p-2">
              <label for="email">Email</label>
              <input class="form-control" id="email" name="email"
                     onblur="validateEmailLoginPage()"
                     placeholder="jane@doe.nz"
                     th:classappend="${errors != null and errors.containsKey('email')} ? 'is-invalid'"
                     th:value="${email}"
                     type="text">
              <p class="text-danger" id="emailError"
                 th:classappend="${errors == null or not errors.containsKey('email')} ? 'd-none'"
                 th:text="${errors != null and errors.containsKey('email')} ? ${errors.get('email')}"></p>
              <div th:if="${success != null}">
                <p class="text-success" id="emailSuccess"
                   style="display: inline;" th:text="${success}"></p>
              </div>
            </div>
            <div class="d-grid p-2">
              <button class="btn btn-primary btn-block" type="submit">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script th:src="@{/js/fieldValidation.js}"></script>
  <script>
      // Code created alongside ChatGPT
      document.getElementById("lostPasswordForm").addEventListener("submit", function (event) {
          event.preventDefault(); // Prevent the form from submitting immediately

          // Run all validation functions
          const valid = validateEmailLoginPage();

          // If all validations are true, submit the form
          if (valid) {
              this.submit(); // Manually submit the form
          } else {
              document.getElementById("emailSuccess").style.display = "none"; // hide success message on bad submission
          }
      });
  </script>
</div>
</body>
</html>
