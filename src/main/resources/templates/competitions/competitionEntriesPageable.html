<div class="container my-4">
  <div class="row g-4">
    <h5 class="text-center w-100 text-secondary fw-light fs-5"
        th:if="${#lists.isEmpty(designs) && !previousCompetition}">
      No entries. Be the first!
    </h5>
    <h5 class="text-center w-100 text-secondary fw-light fs-5"
        th:if="${#lists.isEmpty(designs) && previousCompetition}">
      No entries.
    </h5>
    <div class="col-12 col-sm-6 col-md-4 col-lg-3"
         th:each="design : ${designs}">
      <div th:replace="~{competitions/competitionEntryPreview :: competitionEntryPreview(
        design=${design},
        position=0,
        votedDesigns=${votedDesigns})}">
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col d-flex justify-content-center mt-4">
      <div th:replace="~{fragments/pagination :: pagination(
          ${totalPages},
          @{/competitionDetails/{competitionId}/paged(competitionId=${competition.getId})}
      )}"></div>
    </div>
  </div>
</div>
