<!DOCTYPE html>
<html lang="en">
<head>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <th:block th:insert="~{fragments/head :: head(
      'Edit Profile | Your Space',
      'Edit profile',
      'profile')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/profile/profile.css}">
</head>
<body>
<div th:replace="~{fragments/internal_header:: internalHeader}"></div>
<div id="currentPfp" th:data-profileImagePath="${profileImagePath}"></div>
<div class="d-flex flex-column align-items-center" id="content">
  <h1 class="text-center mt-5">Edit Profile</h1>
  <div class="shadow-lg mt-5 margin-auto p-lg-5 p-md-4 p-2" id="user-details">
    <div class="d-flex justify-content-end mb-3">
      <a class="btn btn-sm px-4 btn-primary" id="change-password-btn" tabindex="1"
         th:href="@{/profile/editPassword}">Change Password</a>
    </div>
    <div class="d-flex
         flex-column gap-4
         flex-md-row gap-md-4 align-items-center justify-content-md-around my-md-4 my-lg-0"
         id="pfp-name-email">
      <div class="d-flex
           flex-row align-items-center justify-content-center
           flex-md-column align-items-md-stretch gap-3"
           id="edit-pfp">
        <img alt="My Profile Picture" class="edit-profile-image circular-image"
             id="pfp-image"
             th:classAppend="${errors != null and errors.containsKey('imageUpload') ? 'image-error' : ''}"
             th:if="${imageToUse == 'userImage' and user.profileImagePath != null}"
             th:src="@{${profileImagePath}}"/>
        <!-- Default image if user doesn't have a profile picture -->
        <img alt="My Profile Picture"
             class="edit-profile-image circular-image"
             id="pfp-image-default"
             th:classAppend="${errors != null and errors.containsKey('imageUpload') ? 'image-error' : ''}"
             th:if="${imageToUse == 'userImage' and user.profileImagePath == null}"
             th:src="@{/img/user_profile_images/Default_pfp.svg}">
        <!-- Image used if a failed submission was made, and it was passed to the view -->
        <img alt="My Profile Picture" class="edit-profile-image circular-image"
             id="pfp-image-failed-req"
             th:classAppend="${errors != null and errors.containsKey('imageUpload') ? 'image-error' : ''}"
             th:if="${imageToUse == 'failSubmissionClientSide'}"
             th:src="'data: ' + ${contentType} + ';base64,' + ${pfpImageBase64}"/>
        <!-- Image used if a failed submission was made, and it wasn't passed to the view -->
        <img alt="My Profile Picture" class="edit-profile-image circular-image"
             id="pfp-image-prev-failed-req"
             th:classAppend="${errors != null and errors.containsKey('imageUpload') ? 'image-error' : ''}"
             th:if="${imageToUse == 'failSubmissionServerSide'}"
             th:src="@{${userDTO.profileImagePath}}"/>
        <div class="d-flex flex-column flex-sm-row flex-md-column gap-3" id="edit-chosen-file">
          <button class="btn btn-outline-secondary small-text mt-4 mt-sm-0"
                  id="editProfilePictureButton"
                  onclick="onEditProfilePictureClicked()"
                  tabindex="7"
                  type="button">edit profile picture
          </button>
          <p class="text-truncate small-text" id="chosen-file-name"
             th:classAppend="${errors != null and errors.containsKey('imageUpload') ? 'text-danger text-decoration-underline' : ''}"
             th:text="${pfpImageName}">
          </p>
          <div th:if="${errors != null and not #maps.isEmpty(errors)}">
            <div th:if="${errors.containsKey('imageUpload')}">
              <p class="text-danger text-center text-lg-start text-md-center" id="imageUploadSsErr"
                 th:text="${errors.imageUpload}"></p>
            </div>
          </div>
          <p class="text-danger" id="imageValidationError" style="display: none"></p>
        </div>
      </div>
      <form class="container" enctype="multipart/form-data" id="name-email-joined" method="POST"
            th:action="@{/profile/edit}">
        <input class="d-none" id="file-input" name="file" onChange="onFileInputChanged()"
               type="file"/>
        <div class="col-md-11 col-sm-12 mx-auto">
          <div class="row g-2" id="name">
            <div class="col-sm-12 col-md-6" id="first">
              <label class="h6" for="firstName">First Name:</label>
              <input class="form-control" id="firstname" name="firstName"
                     oninput="validateFirstNameEditProfilePage()" tabindex="2"
                     th:classAppend="${errors != null and errors[firstName] != null} ? 'is-invalid' : ''"
                     th:value="${userDTO} ? ${userDTO.firstName} : ${user.firstName}"
                     type="text"
                     value="FirstName">
              <p class="text-danger" id="firstNameError"
                 th:style="${errors != null and errors[firstName] != null} ? '' : 'display: none;'"
                 th:text="${errors != null and errors[firstName] != null} ? ${errors[firstName]} : ''"></p>
            </div>
            <div class="col-sm-12 col-md-6" id="last">
              <label class="h6" for="lastName">Last Name:</label>
              <input class="form-control" id="lastname" name="lastName"
                     oninput="validateLastNameEditProfilePage()" tabindex="3"
                     th:classAppend="${errors != null and errors[lastName] != null} ? 'is-invalid' : ''"
                     th:value="${userDTO} ? ${userDTO.lastName} : ${user.lastName}"
                     type="text"
                     value="LastName">
              <p class="text-danger" id="lastNameError"
                 th:style="${errors != null and errors[lastName] != null} ? '' : 'display: none;'"
                 th:text="${errors != null and errors[lastName] != null} ? ${errors[lastName]} : ''"></p>
            </div>
          </div>
          <div class="row my-2" id="email-container">
            <div class="col">
              <label for="email">Email Address:</label>
              <input class="form-control" id="email" name="email"
                     onblur="validateEmailEditProfilePage()" tabindex="4"
                     th:classAppend="${errors != null and errors[email] != null} ? 'is-invalid' : ''"
                     th:value="${userDTO} ? ${userDTO.email} : ${user.email}"
                     type="email">
              <p class="text-danger" id="emailError"
                 th:style="${errors != null and errors[email] != null} ? '' : 'display: none;'"
                 th:text="${errors != null and errors[email] != null} ? ${errors[email]} : ''"></p>
              <div th:if="${errors != null and not #maps.isEmpty(errors)}">
                <div th:if="${errors.containsKey('emailInUse')}">
                  <div class="text-danger">
                    <span id="emailInUseError" th:text="${errors.emailInUse}"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row my-2" id="location-container">
            <div class="col">
              <div th:replace="~{fragments/locationFragment :: locationFragment(${false})}"></div>
            </div>
          </div>

          <div class="row mt-sm-4 mt-md-0">
            <div class="col col-lg-4 col-md-6 col-sm-12">
              <a class="btn btn-secondary d-block" tabindex="6"
                 th:href="@{/profile}">Cancel</a>
            </div>
            <div class="col col-lg-4 col-md-6 col-sm-12 mt-sm-3 mt-md-0">
              <button class="btn btn-primary w-100" id="submitButton" tabindex="5" type="submit">
                Submit
              </button>
            </div>
          </div>
        </div>
        <input id="use-fail-submission-image" name="useFailSubmissionImage"
               th:value="${pfpImageName == null ? 'false' : 'true'}"
               type="hidden">
      </form>
    </div>
  </div>
</div>
<script defer th:src="@{/js/fieldValidation.js}"></script>
<script defer th:src="@{/js/editProfileValidation.js}"></script>
</body>
</html>
