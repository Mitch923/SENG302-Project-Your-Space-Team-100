spring.application.name=home-helper
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
app.runner.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=fake@email.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
email.verification.deletionTime=1
email.resetPassword.deletionTime=1
email.resetPassword.baseUrl=http://localhost:8080
spring.config.import=optional:file:env.properties
app.perspective.api.key=fakekeyhere
mapbox.api.key=fakekeyhere
ipapi.api.key=fakekeyhere
static.resource.folder=test-uploads
scheduler.cron=0 59 23 * * SUN
